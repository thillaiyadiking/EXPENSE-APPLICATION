name: pocketflow
description: PocketFlow — a premium offline-first expense tracker.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Local database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & charts
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  gap: ^3.0.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.19.1
  path_provider: ^2.1.5
  path: ^1.9.1

  # Export & share
  csv: ^6.0.0
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^11.0.0

  # Security & notifications
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  home_widget: ^0.9.3
  quick_actions: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/pocketflow_icon.png
  adaptive_icon_background: "#0F766E"
  adaptive_icon_foreground: assets/branding/pocketflow_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
